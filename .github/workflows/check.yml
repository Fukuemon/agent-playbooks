name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # skill 契約 + 生成物 drift (make check)。drift すると古い設定が silent に配られるため硬いゲート。
      - run: make check
